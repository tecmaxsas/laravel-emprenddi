; Corta una petición que pase de 90 s y libera el worker.
; Sin esto, una página colgada ocupa el worker para siempre (max_execution_time
; es 0) y con pm.max_children = 5 basta con que un usuario recargue unas
; cuantas veces para tumbar el sistema (caídas del 2026-11-04 y 2026-11-05).
; El 2026-11-17 bajó de 300 s a 90 s: con la CPU saturada, las recargas
; abandonadas (499) seguían ocupando workers hasta 5 minutos.
; Debe coincidir con fastcgi_read_timeout de docker/nginx/prod.conf.
[www]
request_terminate_timeout = 90s
