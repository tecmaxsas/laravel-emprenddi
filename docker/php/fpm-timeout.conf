; Corta una petición que pase de 300 s y libera el worker.
; Sin esto, una página colgada ocupa el worker para siempre (max_execution_time
; es 0) y con pm.max_children = 5 basta con que un usuario recargue unas
; cuantas veces para tumbar el sistema (caídas del 2026-11-04 y 2026-11-05).
; Va en 300 s porque nginx corta a los 300 s (fastcgi_read_timeout).
[www]
request_terminate_timeout = 300s
